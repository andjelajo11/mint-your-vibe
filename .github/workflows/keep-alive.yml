name: keep-backend-warm

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health endpoint
        run: |
          curl -sf https://mint-your-vibe.onrender.com || echo "Ping failed - backend may be cold-starting, that's expected occasionally"
